name: Catalog refresh

# Daily job for the pgvector catalog (spec 0013, AC-10): adds new and popular
# titles, refreshes vote counts for a rotating slice of existing rows, and
# embeds any row that has no embedding yet. Never deletes. Stops adding at
# CATALOG_SIZE_CAP_MB.
#
# Repository secrets needed (Settings > Secrets and variables > Actions):
#   TMDB_TOKEN    TMDB API read access token
#   DATABASE_URL  the IPv4 session pooler URL (same one the keep alive job uses)
#
# GitHub turns off scheduled workflows after 60 days with no repository
# activity. If the refresh goes quiet, open the Actions tab and enable it again.
# A failed run emails whoever last edited this file.

on:
  schedule:
    - cron: "43 4 * * *"   # daily; the keep alive job runs at 06:17 every 3 days
  workflow_dispatch:

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
      CATALOG_SIZE_CAP_MB: "300"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: pip install -r requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-all-MiniLM-L6-v2

      - name: Check secrets
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$TMDB_TOKEN" ] || [ -z "$DATABASE_URL" ]; then
            echo "TMDB_TOKEN and DATABASE_URL secrets must both be set" >&2
            exit 1
          fi

      - name: Refresh the catalog
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m db.refresh_catalog
