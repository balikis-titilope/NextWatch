name: Supabase keep-alive

# Free Supabase projects pause after ~7 days with no activity. The backend's own
# daily jobs keep it busy once deployed, but this is a safety net in case the
# app is scaled to zero. Runs a trivial query every 3 days.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set" >&2
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from movies;"
